# Copy this file to .streamlit/secrets.toml (or paste into Streamlit Community Cloud -> App Settings -> Secrets)

# 1. AI Interrogator API Key (Configure at least one, or enter in the UI sidebar)
GEMINI_API_KEY = "your-gemini-api-key-here"
OPENAI_API_KEY = "your-openai-api-key-here"

# 2. GitHub Auto-Sync for SQLite (Keep your database saved to your private GitHub repo from Streamlit Cloud!)
GITHUB_TOKEN = "ghp_your_personal_access_token_with_repo_scope"
GITHUB_REPO = "your-username/budget_2027"
GITHUB_BRANCH = "main"
GITHUB_DB_PATH = "data/budget_2027.db"
